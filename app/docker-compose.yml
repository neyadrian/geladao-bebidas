services:
  mysql:
    image: mysql:8.0
    container_name: geladao-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 2798
      MYSQL_DATABASE: geladao_bebidas
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p2798"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: geladao-app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/geladao_bebidas
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 2798

volumes:
  mysql_data: